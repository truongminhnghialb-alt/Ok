workflows:
  android-debug:
    name: Hive Macro Pro APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/**/*.apk
